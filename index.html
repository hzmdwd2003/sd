<div class="mobile-sticky">
  <a class="btn btn-whatsapp" data-whatsapp>
    Jetzt auf WhatsApp anfragen
  </a>
</div>

<script src="script.js?v=15"></script>

<!-- Google Ads WhatsApp Conversion -->
<script>
document.addEventListener('DOMContentLoaded', function () {
  document.querySelectorAll('[data-whatsapp]').forEach(function (element) {
    element.addEventListener('click', function () {
      if (typeof gtag === 'function') {
        gtag('event', 'conversion', {
          'send_to': 'AW-18306707563/na3pCNqYx98cEOvgqJlE'
        });
      }
    });
  });
});
</script>

</body>
</html>
