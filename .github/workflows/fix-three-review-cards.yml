name: Fix three review cards

on:
  push:
    paths:
      - '.github/workflows/fix-three-review-cards.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep 3 review cards and put slideshow in middle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Remove the previously injected standalone review-slider section from both homepages.
          for path in ['index.html','en/index.html']:
              p=Path(path)
              s=p.read_text()
              s=re.sub(r'\n<section class="section reviews-section".*?</section>\n(?=</main>)','\n',s,flags=re.S)
              p.write_text(s)

          p=Path('script.js')
          s=p.read_text()
          marker='/* UX / SOCIAL / REVIEWS / MOBILE FORM - 2026-08-22 */'
          base=s.split(marker)[0].rstrip()
          tail=r'''/* UX / SOCIAL / REVIEWS / MOBILE FORM - 2026-08-22 */
(()=>{
  const en=isEN();

  if(!en){
    $$('a,button').forEach(el=>{
      const t=(el.textContent||'').trim();
      const map={
        'Jetzt anfragen':'Jetzt kostenlos anfragen',
        'Direkt per WhatsApp':'Kostenlos Ihre Fahrt anfragen',
        'Jetzt auf WhatsApp anfragen':'Kostenlos per WhatsApp anfragen',
        'Preis per WhatsApp anfragen':'Kostenlos Preis anfragen',
        'Fahrt anfragen':'Kostenlos Fahrt anfragen',
        'XL-Preis anfragen':'XL-Preis kostenlos anfragen'
      };
      if(map[t]) el.textContent=map[t];
    });
  }

  const style=document.createElement('style');
  style.id='sd-ux-20260822';
  style.textContent=`
    .reviews-section{display:none!important}
    .sd-rating-mini{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.08);font-size:11px;font-weight:800;color:#fff}
    .sd-rating-mini b{color:#f5b301;letter-spacing:1px}
    .sd-reviews{background:#f5f6f7;color:#0a1118}
    .sd-review-grid{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:20px;align-items:stretch}
    .sd-review-card{display:flex;flex-direction:column;min-height:330px;padding:30px;border:1px solid #dde3e8;border-radius:18px;background:#fff;box-shadow:0 14px 34px rgba(15,31,46,.07)}
    .sd-review-card.featured{border-top:4px solid #f5b301}
    .sd-review-stars{font-size:22px;letter-spacing:3px;color:#f5b301;margin-bottom:18px;line-height:1}
    .sd-review-card strong{font-size:20px;letter-spacing:-.025em;margin-bottom:10px}
    .sd-review-card p{font-size:13px;color:#6b7885;margin:0 0 20px}
    .sd-review-card .review-link{margin-top:auto;font-size:12px;font-weight:800;color:#071019}
    .sd-review-center{position:relative;overflow:hidden;text-align:center;justify-content:center;padding:34px 48px}
    .sd-review-center .sd-review-stars{font-size:25px;margin-bottom:20px}
    .sd-review-slide{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:250px}
    .sd-review-slide.is-active{display:flex}
    .sd-review-slide blockquote{margin:0 auto 22px;font-size:17px;line-height:1.55;color:#4d5965}
    .sd-review-slide strong{font-size:18px;margin:0;color:#071019}
    .sd-review-slide .review-meta{margin-top:4px;font-size:11px;color:#8c98a3}
    .sd-review-nav{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border:1px solid #dce2e7;border-radius:50%;background:#fff;color:#071019;font-size:24px;cursor:pointer;z-index:3;box-shadow:0 6px 18px rgba(7,16,25,.10)}
    .sd-review-nav.prev{left:8px}.sd-review-nav.next{right:8px}
    .sd-review-dots{display:flex;justify-content:center;gap:6px;margin-top:14px}
    .sd-review-dot{width:7px;height:7px;border:0;border-radius:50%;padding:0;background:#c9d0d6;cursor:pointer}
    .sd-review-dot.is-active{background:#071019}
    .sd-social-row{margin-top:24px;padding:20px 22px;border-radius:16px;background:#071019;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .sd-social-copy{display:grid;gap:3px}.sd-social-copy strong{font-size:16px}.sd-social-copy span{font-size:11px;color:#9eabb8}
    .sd-social-links{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}
    .sd-social-link{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.16);font-size:11px;font-weight:800;color:#fff}
    .sd-social-link.instagram{background:linear-gradient(115deg,#6a35c7,#cf3168,#e48c2f);border:0}
    .sd-social-link.facebook{background:#1877f2;border:0}.sd-social-link.pending{opacity:.45;cursor:default}
    @media(max-width:980px){.sd-review-grid{grid-template-columns:1fr}.sd-review-card{min-height:260px}.sd-review-center{min-height:360px}.sd-social-row{align-items:flex-start;flex-direction:column}.sd-social-links{justify-content:flex-start}}
    @media(max-width:680px){
      .inquiry-card .field:has([name="child_seats"]),.inquiry-card .field:has([name="luggage"]),.inquiry-card .field:has([name="flight"]),.inquiry-card .return-trip{display:none!important}
      .inquiry-card .form-grid{grid-template-columns:1fr 1fr!important}.inquiry-card .field.wide{grid-column:1/-1!important}.inquiry-card{padding:18px!important}
      .card-head{margin-bottom:14px!important}.card-head h2{font-size:20px!important}.card-head p{font-size:10px!important}.form-assurance{justify-content:center!important}
      .sd-review-card{padding:22px;min-height:0}.sd-review-center{padding:28px 40px;min-height:390px}.sd-review-slide blockquote{font-size:15px}.sd-review-nav{width:32px;height:32px;font-size:22px}
      .sd-reviews .section-head{text-align:left;margin-left:0}.sd-reviews .section-head h2{font-size:32px!important}.sd-social-links{width:100%}.sd-social-link{width:100%}
    }
  `;
  document.head.appendChild(style);

  const heroActions=$('.page-hero .hero-actions');
  if(heroActions && !$('.sd-rating-mini')){
    const rating=document.createElement('a');
    rating.className='sd-rating-mini';
    rating.href='https://www.google.com/maps/search/?api=1&query=SD%20Flughafentransfer%20Skyline%20Drive%20GmbH';
    rating.target='_blank';rating.rel='noopener';
    rating.innerHTML=en?'<b>★★★★★</b><span>5/5 on Google · Read reviews</span>':'<b>★★★★★</b><span>5/5 bei Google · Rezensionen ansehen</span>';
    heroActions.insertAdjacentElement('afterend',rating);
  }

  const isHome=en ? (location.pathname.endsWith('/en/') || location.pathname.endsWith('/en/index.html')) : (location.pathname==='/' || location.pathname.endsWith('/index.html'));
  const reviews=[
    ['Mark K.','Pünktlich, höflich, preiswert. Kann Ich nur empfehlen.'],
    ['Pia K.','Alles Prima! Wir wurden pünktlich abgeholt. Die Fahrt war sehr angenehm in einem sauberen Auto mit einem netten und freundlichen Fahrer. Zudem war der Preis sehr fair und günstiger als alle anderen Angebote, die wir erhalten haben. Jederzeit wieder :)'],
    ['Ayman A.','Super Service, sehr zuverlässiges Personal. Kann Ich nur weiterempfehlen!'],
    ['Sher S.','Super Fahrservice und unkomplizierter Ablauf. Gerne wieder.'],
    ['Gokhan Kapusuz','Top Service! Immer Pünktlich, sehr freundliche Fahrer und gepflegte Fahrzeuge. Die Fahrten sind angenehm und zuverlässig. Absolut empfehlenswert- gerene wieder!'],
    ['Ali A.','Great Service. I needed a ride to the airport and i came across the website. The communication and planning was very quick and easy. The driver was also great.'],
    ['Helena K.','Leichtes Buchen sehr nette Fahrer einfach alles top.'],
    ['Victor B.','Sehr zufrieden, alles war super gerne wieder.'],
    ['M. Sher','Alles war top freundlich, professionell und eine rundum positive Erfahrung. Klare Empfehlung !'],
    ['Aryan S.','Empehlenswerter Chauffeurdienst. Leichte Buchung und Angenehmer Fahrer.']
  ];

  const main=$('main');
  if(isHome && main){
    $('#kundenbewertungen')?.remove();
    $('#customer-reviews')?.remove();
    $('#bewertungen')?.remove();
    const section=document.createElement('section');
    section.className='section sd-reviews';
    section.id=en?'customer-reviews':'kundenbewertungen';
    const slides=reviews.map(([name,text],i)=>`<article class="sd-review-slide${i===0?' is-active':''}" data-review-slide><div class="sd-review-stars">★★★★★</div><blockquote>${text}</blockquote><strong>${name}</strong><span class="review-meta">${en?'Google review · 5 stars':'Google Rezension · 5 Sterne'}</span></article>`).join('');
    section.innerHTML=`<div class="wrap"><div class="section-head"><span class="eyebrow">${en?'Customer reviews':'Kundenbewertungen'}</span><h2>${en?'What our customers say':'Was unsere Kunden sagen'}</h2></div><div class="sd-review-grid">
      <a class="sd-review-card featured" href="https://www.google.com/maps/search/?api=1&query=SD%20Flughafentransfer%20Skyline%20Drive%20GmbH" target="_blank" rel="noopener"><div class="sd-review-stars">★★★★★</div><strong>${en?'5/5 stars on Google':'5/5 Sterne bei Google'}</strong><p>${en?'Open our Google business profile and read our customer reviews.':'Öffnen Sie unser Google-Unternehmensprofil und lesen Sie die aktuellen Kundenrezensionen.'}</p><span class="review-link">${en?'View Google reviews →':'Google Rezensionen ansehen →'}</span></a>
      <div class="sd-review-card sd-review-center" data-review-slider><button class="sd-review-nav prev" type="button" data-review-prev aria-label="${en?'Previous review':'Vorherige Rezension'}">‹</button><div data-review-stage>${slides}</div><button class="sd-review-nav next" type="button" data-review-next aria-label="${en?'Next review':'Nächste Rezension'}">›</button><div class="sd-review-dots" data-review-dots></div></div>
      <a class="sd-review-card" href="https://g.page/r/CQssm-DfUmlzECA/review" target="_blank" rel="noopener"><div class="sd-review-stars">★★★★★</div><strong>${en?'Already travelled with us?':'Schon mit uns gefahren?'}</strong><p>${en?'Share your experience on Google and help other passengers choose their airport transfer.':'Teilen Sie Ihre Erfahrung direkt auf Google und helfen Sie anderen Fahrgästen bei der Auswahl.'}</p><span class="review-link">${en?'Leave a Google review →':'Google Bewertung abgeben →'}</span></a>
    </div><div class="sd-social-row"><div class="sd-social-copy"><strong>${en?'Follow Skyline Drive':'Folgen Sie Skyline Drive'}</strong><span>${en?'Vehicles, updates and airport-transfer insights.':'Fahrzeuge, Einblicke und Neuigkeiten rund um unseren Flughafentransfer.'}</span></div><div class="sd-social-links"><a class="sd-social-link instagram" href="https://www.instagram.com/Skylinedrive_Frankfurt/" target="_blank" rel="noopener">Instagram · @Skylinedrive_Frankfurt</a><span class="sd-social-link facebook pending">Facebook</span></div></div></div>`;
    main.appendChild(section);

    const slider=$('[data-review-slider]',section), slidesEls=$$('[data-review-slide]',slider), dotsWrap=$('[data-review-dots]',slider);
    let index=0,timer;
    const dots=slidesEls.map((_,i)=>{const b=document.createElement('button');b.type='button';b.className='sd-review-dot'+(i===0?' is-active':'');b.setAttribute('aria-label',`${en?'Show review':'Rezension anzeigen'} ${i+1}`);b.addEventListener('click',()=>show(i,true));dotsWrap.appendChild(b);return b});
    function show(i,restart=false){index=(i+slidesEls.length)%slidesEls.length;slidesEls.forEach((s,n)=>s.classList.toggle('is-active',n===index));dots.forEach((d,n)=>d.classList.toggle('is-active',n===index));if(restart)start()}
    function start(){clearInterval(timer);timer=setInterval(()=>show(index+1),6000)}
    $('[data-review-prev]',slider).addEventListener('click',()=>show(index-1,true));$('[data-review-next]',slider).addEventListener('click',()=>show(index+1,true));slider.addEventListener('mouseenter',()=>clearInterval(timer));slider.addEventListener('mouseleave',start);start();
  }
})();'''
          p.write_text(base+'\n\n'+tail+'\n')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html en/index.html script.js
          git diff --cached --quiet || git commit -m "Keep review cards and add slideshow to center card"
          git push
